<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅遊手冊首頁</title>

    <!-- 🔧 PWA 設定 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="images/icons/icon-192.png">

    <!-- 🍔 側邊導覽列共用樣式 -->
    <link rel="stylesheet" href="css/nav.css">

    <style>
        /* 1. 基礎重設與背景設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
        }

        /* 旅遊封面外殼 */
        .cover-container {
            min-height: 100vh; 
            width: 100%;
            background-image: linear-gradient(rgba(15, 23, 42, 0.15), rgba(15, 23, 42, 0.25)), url('https://firebasestorage.googleapis.com/v0/b/briotravelgroupdatabase.firebasestorage.app/o/BrioTravelBook_Okinawa2026_PageImages%2FCoverBG.webp?alt=media&token=11ddad33-7f03-4546-915d-7f3c38ff739c');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: relative;
            
            /* 手機版自然網頁流排版 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; 
            padding: 24px 16px 48px 16px; 
            gap: 16px; 
        }

        /* 🌤️ 左上角極簡天氣小工具樣式（主頁顯示當前選定區域與溫度） */
        .weather-widget {
            position: absolute;
            top: 20px;
            left: 16px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease, background 0.3s ease;
        }
        .weather-widget:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.2);
        }

        /* 🌤️ 天氣詳細資訊抽屜彈窗 (Bottom Sheet) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 199;
        }
        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .weather-drawer {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            max-height: 75vh;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 32px 32px 0 0;
            z-index: 200;
            padding: 24px;
            color: #ffffff;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
            transition: bottom 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .weather-drawer.open {
            bottom: 0;
        }
        /* 抽屜頂部小把手線條 */
        .drawer-handle {
            width: 40px;
            height: 5px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            margin: -8px auto 16px auto;
        }
        .drawer-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .drawer-subtitle {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 16px;
        }
        
        /* 🗺️【新功能】分區切換標籤切換器 (Tabs) */
        .region-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.08);
            padding: 4px;
            border-radius: 14px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            padding: 8px 0;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .tab-btn.active {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        /* 每1小時預報橫向捲動軸與卡片 */
        .forecast-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 12px;
            min-height: 110px;
        }
        .forecast-scroll::-webkit-scrollbar { height: 4px; }
        .forecast-scroll::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
        .forecast-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
        
        .forecast-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 12px 10px;
            min-width: 80px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
            animation: fadeIn 0.4s ease forwards;
        }
        .forecast-time { font-size: 0.8rem; color: rgba(255, 255, 255, 0.7); }
        .forecast-icon { font-size: 1.4rem; margin: 2px 0; }
        .forecast-temp { font-size: 0.95rem; font-weight: bold; }
        .forecast-rain { font-size: 0.75rem; color: #38bdf8; font-weight: 500; }

        /* 2. 大標題樣式 */
        .title-image-wrapper {
            text-align: center;
            width: 100%;
            max-width: 500px; 
            z-index: 2;
            margin-top: 7vh; 
            margin-bottom: 4px;
        }
        .title-image {
            width: 100%;
            height: auto;
        }

        /* 3. 資訊面板外殼 */
        .info-panel {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 2;
        }

        /* 高級毛玻璃卡片核心 */
        .card {
            background: rgba(255, 255, 255, 0.12); 
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 14px 20px; 
            border: 1px solid rgba(255, 255, 255, 0.25); 
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.3);
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
            transition: all 0.5s ease;
        }

        /* 4. 倒數日置中與計時器欄位 */
        .countdown-container {
            text-align: center; 
            min-height: 95px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .countdown-title {
            font-size: 0.9rem; 
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 7px; 
            letter-spacing: 1px;
        }
        .countdown-timer {
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        
        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 50px;
        }
        
        /* 滾動視窗與文字軌道樣式 */
        .scroll-window {
            height: 1.8rem; 
            overflow: hidden;
            position: relative;
            width: 100%;
        }
        .scroll-track {
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .scroll-track.slide-up {
            transform: translateY(-50%);
        }

        /* 數字滑動 + 淡入淡出 CSS 設定 */
        .time-num {
            font-size: 1.8rem; 
            line-height: 1.8rem; 
            font-weight: 700;
            font-variant-numeric: tabular-nums; 
            color: #ffffff;
            text-align: center;
            height: 1.8rem;
            opacity: 1;
            transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .time-num.next {
            opacity: 0; 
        }
        .scroll-track.slide-up .time-num.current {
            opacity: 0;
        }
        .scroll-track.slide-up .time-num.next {
            opacity: 1;
        }
        
        .time-label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 5px;
        }

        /* 5. 狀態切換祝福語樣式 */
        .blessing-message {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            animation: fadeIn 0.6s ease forwards;
        }
        .airplane-icon {
            font-size: 1.8rem;
            animation: float 3s ease-in-out infinite;
        }
        .blessing-text {
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #ffffff, #e2e8f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        /* 📸 條件式隱藏雲端相簿按鈕樣式 */
        .album-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: #ffffff;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(29, 78, 216, 0.4);
            text-shadow: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .album-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 10px rgba(29, 78, 216, 0.2);
        }

        /* 6. 待辦事項卡片樣式 */
        .todo-title {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: #ffffff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 6px;
        }

        .todo-list {
            list-style: none;
            max-height: 180px; 
            overflow-y: auto;   
            padding-right: 4px;
        }
        .todo-list::-webkit-scrollbar { width: 4px; }
        .todo-list::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 10px; }
        .todo-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.25); border-radius: 10px; }

        .todo-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.9);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .todo-item input {
            margin-right: 10px;
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #ffffff; 
        }
        .todo-item.completed {
            color: rgba(255, 255, 255, 0.4);
            text-decoration: line-through;
        }

        /* 7. 電腦版 RWD 排版 */
        @media (min-width: 992px) {
            body, html {
                overflow: hidden; 
            }
            .cover-container {
                display: grid;
                grid-template-columns: 1fr auto 1fr;
                grid-template-rows: 1fr;
                align-items: center;
                height: 100vh; 
                padding: 60px;
                gap: 30px;
            }
            .weather-widget {
                position: fixed;
                top: 30px;
                left: 30px;
            }
            .weather-drawer {
                width: 420px;
                max-height: 85vh;
                left: 30px;
                bottom: -100%;
                border: 1px solid rgba(255, 255, 255, 0.2);
                border-radius: 28px;
            }
            .weather-drawer.open {
                bottom: 30px;
            }
            .drawer-handle { display: none; }
            
            .title-image-wrapper {
                grid-column: 2;
                grid-row: 1;
                max-width: 600px;
                margin-top: 0; 
                margin-bottom: 0;
            }
            .info-panel {
                grid-column: 1;
                grid-row: 1;
                justify-self: end;
                margin-right: 50px;
                width: 350px;
                gap: 24px;
            }
            .card {
                padding: 24px; 
            }
            .countdown-container {
                min-height: 114px;
            }
            .countdown-title {
                font-size: 0.95rem;
                margin-bottom: 12px;
            }
            .scroll-window {
                height: 2.4rem;
            }
            .time-num {
                font-size: 2rem;
                line-height: 2.4rem;
                height: 2.4rem;
            }
            .todo-title {
                font-size: 1.1rem;
                margin-bottom: 16px;
                padding-bottom: 8px;
            }
            .todo-list {
                max-height: 280px; 
            }
            .todo-item {
                font-size: 0.95rem;
                margin-bottom: 12px;
            }
        }

        /* 8. 動畫定義 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
    </style>
</head>
<body>

    <!-- 🍔 側邊導覽列插入點（由 js/nav.js 動態載入內容） -->
    <div id="nav-placeholder"></div>

    <!-- 🌤️ 主頁天氣極簡小膠囊（會隨選定區域連動更換） -->
    <div class="weather-widget" id="weatherBtn">
        <span id="widgetRegion">那霸</span><span id="widgetIcon">☀️</span><span id="widgetTemp">32°C</span>
    </div>

    <!-- 🌤️ 天氣細節半透明抽屜與遮罩 -->
    <div class="modal-overlay" id="modalOverlay"></div>
    <div class="weather-drawer" id="weatherDrawer">
        <div class="drawer-handle"></div>
        <div class="drawer-title">🌤️ 沖繩即時天氣預報</div>
        <div class="drawer-subtitle">點擊標籤切換預報區域</div>
        
        <!-- 🗺️ 區域切換標籤 -->
        <div class="region-tabs">
            <button class="tab-btn active" onclick="switchRegion('naha')">那霸</button>
            <button class="tab-btn" onclick="switchRegion('onna')">恩納</button>
            <button class="tab-btn" onclick="switchRegion('nago')">名護</button>
        </div>

        <!-- 每小時預報滾動容器（由 JS 動態渲染切換） -->
        <div class="forecast-scroll" id="forecastContainer"></div>
    </div>

    <!-- 主要內容滾動容器 -->
    <div class="cover-container">
        
        <!-- 大標題 -->
        <div class="title-image-wrapper">
            <img class="title-image" src="https://firebasestorage.googleapis.com/v0/b/briotravelgroupdatabase.firebasestorage.app/o/BrioTravelBook_Okinawa2026_PageImages%2FCoverTitle.webp?alt=media&token=d4dbddcf-4f92-48fb-a6f5-79128c11b90e" alt="旅遊手冊標題">
        </div>

        <!-- 資訊卡片群 -->
        <div class="info-panel">
            
            <!-- 計時器卡片 -->
            <div class="card countdown-container" id="countdownCard">
                <div id="countdownActiveContent">
                    <div class="countdown-title">⏱️ 距離出發沖繩還有</div>
                    <div class="countdown-timer">
                        <div class="time-box">
                            <div class="scroll-window">
                                <div class="scroll-track" id="track-days">
                                    <div class="time-num current">00</div>
                                    <div class="time-num next">00</div>
                                </div>
                            </div>
                            <span class="time-label">天</span>
                        </div>
                        <div class="time-box">
                            <div class="scroll-window">
                                <div class="scroll-track" id="track-hours">
                                    <div class="time-num current">00</div>
                                    <div class="time-num next">00</div>
                                </div>
                            </div>
                            <span class="time-label">時</span>
                        </div>
                        <div class="time-box">
                            <div class="scroll-window">
                                <div class="scroll-track" id="track-minutes">
                                    <div class="time-num current">00</div>
                                    <div class="time-num next">00</div>
                                </div>
                            </div>
                            <span class="time-label">分</span>
                        </div>
                        <div class="time-box">
                            <div class="scroll-window">
                                <div class="scroll-track" id="track-seconds">
                                    <div class="time-num current">00</div>
                                    <div class="time-num next">00</div>
                                </div>
                            </div>
                            <span class="time-label">秒</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 待辦清單卡片 -->
            <div class="card">
                <div class="todo-title">📝 待辦清單</div>
                <ul class="todo-list" id="todoListContainer"></ul>
            </div>

        </div>

    </div>

    <script>
        // ==========================================
        // ⚙️ 核心設定區（時間軸與隱藏驚喜設定）
        // ==========================================
        const TARGET_DATE_STRING = "2026-07-09T09:00:00"; 
        const END_DATE_STRING    = "2026-07-13T18:00:00"; 
        const ALBUM_URL = "https://photos.google.com"; 

        const DEFAULT_TODOS = [
            "付旅費",
            "準備Dress Code服裝<br>(7/10 花襯衫 | 7/12 藍白配)",
            "換日幣",
            "買網路 (eSim / 實體Sim卡)",
            "收行李 (泳具 / 駕照譯本)",
            "填寫Visit Web Japan",
            "7/9 16:30前桃園國際機場集合",
            "買FunPass"
        ];

        // ==========================================
        // 🌤️【分區數據】那霸、恩納、名護的三地氣象模擬資料
        // ==========================================
        const WEATHER_DATA = {
            naha: {
                name: "那霸", icon: "☀️", temp: "32°C",
                forecast: [
                    { time: "11:00", icon: "☀️", temp: "32°C", rain: "💧 10%" },
                    { time: "12:00", icon: "☀️", temp: "32°C", rain: "💧 10%" },
                    { time: "13:00", icon: "☀️", temp: "33°C", rain: "💧 15%" },
                    { time: "14:00", icon: "⛅", temp: "31°C", rain: "💧 20%" },
                    { time: "15:00", icon: "⛅", temp: "31°C", rain: "💧 30%" },
                    { time: "16:00", icon: "🌧️", temp: "29°C", rain: "💧 60%" },
                    { time: "17:00", icon: "🌧️", temp: "28°C", rain: "💧 80%" },
                    { time: "18:00", icon: "☁️", temp: "27°C", rain: "💧 40%" }
                ]
            },
            onna: {
                name: "恩納", icon: "⛅", temp: "30°C",
                forecast: [
                    { time: "11:00", icon: "⛅", temp: "30°C", rain: "💧 20%" },
                    { time: "12:00", icon: "⛅", temp: "31°C", rain: "💧 25%" },
                    { time: "13:00", icon: "☁️", temp: "30°C", rain: "💧 40%" },
                    { time: "14:00", icon: "🌧️", temp: "28°C", rain: "💧 75%" },
                    { time: "15:00", icon: "🌧️", temp: "27°C", rain: "💧 90%" },
                    { time: "16:00", icon: "⛈️", temp: "26°C", rain: "💧 85%" },
                    { time: "17:00", icon: "⛅", temp: "28°C", rain: "💧 30%" },
                    { time: "18:00", icon: "☀️", temp: "29°C", rain: "💧 10%" }
                ]
            },
            nago: {
                name: "名護", icon: "☀️", temp: "33°C",
                forecast: [
                    { time: "11:00", icon: "☀️", temp: "31°C", rain: "💧 0%" },
                    { time: "12:00", icon: "☀️", temp: "33°C", rain: "💧 5%" },
                    { time: "13:00", icon: "☀️", temp: "34°C", rain: "💧 10%" },
                    { time: "14:00", icon: "☀️", temp: "33°C", rain: "💧 10%" },
                    { time: "15:00", icon: "☀️", temp: "32°C", rain: "💧 15%" },
                    { time: "16:00", icon: "⛅", temp: "31°C", rain: "💧 20%" },
                    { time: "17:00", icon: "⛅", temp: "30°C", rain: "💧 20%" },
                    { time: "18:00", icon: "☁️", temp: "29°C", rain: "💧 30%" }
                ]
            }
        };

        // ==========================================
        // 🌤️【天氣控制】切換分區標籤與彈窗邏輯
        // ==========================================
        const weatherBtn = document.getElementById('weatherBtn');
        const weatherDrawer = document.getElementById('weatherDrawer');
        const modalOverlay = document.getElementById('modalOverlay');
        const forecastContainer = document.getElementById('forecastContainer');

        let currentRegion = 'naha'; // 預設那霸

        function openWeather() {
            weatherDrawer.classList.add('open');
            modalOverlay.classList.add('open');
            renderForecast(currentRegion); // 開啟時渲染
        }
        function closeWeather() {
            weatherDrawer.classList.remove('open');
            modalOverlay.classList.remove('open');
        }

        // 切換分區核心邏輯
        function switchRegion(regionKey) {
            currentRegion = regionKey;
            
            // 1. 更新 Tabs 按鈕高亮狀態
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // 2. 更新首頁極簡小膠囊顯示
            document.getElementById('widgetRegion').innerText = WEATHER_DATA[regionKey].name;
            document.getElementById('widgetIcon').innerText = WEATHER_DATA[regionKey].icon;
            document.getElementById('widgetTemp').innerText = WEATHER_DATA[regionKey].temp;

            // 3. 重新渲染每小時詳細預報
            renderForecast(regionKey);
        }

        // 渲染預報卡片
        function renderForecast(regionKey) {
            forecastContainer.innerHTML = '';
            const data = WEATHER_DATA[regionKey].forecast;
            
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'forecast-card';
                card.innerHTML = `
                    <span class="forecast-time">${item.time}</span>
                    <span class="forecast-icon">${item.icon}</span>
                    <span class="forecast-temp">${item.temp}</span>
                    <span class="forecast-rain">${item.rain}</span>
                `;
                forecastContainer.appendChild(card);
            });
        }

        weatherBtn.addEventListener('click', openWeather);
        modalOverlay.addEventListener('click', closeWeather);
        weatherDrawer.addEventListener('click', (e) => {
            if (e.target.className === 'drawer-handle') closeWeather();
        });

        // 預先載入預設區域
        renderForecast(currentRegion);

        // ==========================================
        // ⏱️ 智慧三階段時間軸狀態控制
        // ==========================================
        let currentTimelineState = ""; 
        let lastTimeStrings = { days: "", hours: "", minutes: "", seconds: "" };

        function updateTimeline() {
            const targetTime = new Date(TARGET_DATE_STRING).getTime();
            const endTime = new Date(END_DATE_STRING).getTime();
            const now = new Date().getTime();

            if (now < targetTime) {
                currentTimelineState = "countdown";
                const difference = targetTime - now;

                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                handleScrollAnimation('days', String(days).padStart(2, '0'));
                handleScrollAnimation('hours', String(hours).padStart(2, '0'));
                handleScrollAnimation('minutes', String(minutes).padStart(2, '0'));
                handleScrollAnimation('seconds', String(seconds).padStart(2, '0'));
            } 
            else if (now >= targetTime && now < endTime) {
                showDuringTripMessage();
            } 
            else {
                showPostTripMessage();
            }
        }

        function showDuringTripMessage() {
            if (currentTimelineState === "during") return;
            currentTimelineState = "during";

            const card = document.getElementById('countdownCard');
            card.style.opacity = 0;
            setTimeout(() => {
                card.innerHTML = `
                    <div class="blessing-message">
                        <div class="airplane-icon">✈️</div>
                        <div class="blessing-text">出團中</div>
                    </div>
                `;
                card.style.opacity = 1;
            }, 500);
        }

        function showPostTripMessage() {
            if (currentTimelineState === "ended") return;
            currentTimelineState = "ended";

            const card = document.getElementById('countdownCard');
            card.style.opacity = 0;
            setTimeout(() => {
                let albumButtonHtml = "";
                if (ALBUM_URL && ALBUM_URL.trim() !== "") {
                    albumButtonHtml = `
                        <a href="${ALBUM_URL}" target="_blank" class="album-btn">
                            📸 點我查看團員雲端相簿
                        </a>
                    `;
                }

                card.innerHTML = `
                    <div class="blessing-message">
                        <div class="airplane-icon">❤️</div>
                        <div class="blessing-text" style="font-size: 0.95rem; line-height: 1.6; text-align: center; padding: 0 4px;">
                            歡迎回家！<br>希望這趟沖繩之旅為您留下了一輩子珍藏的美好回憶。
                        </div>
                        ${albumButtonHtml}
                    </div>
                `;
                card.style.opacity = 1;
            }, 500);
        }

        // ==========================================
        // 🛠️ 底層核心功能（滾動數字、待辦渲染）
        // ==========================================
        let todoData = DEFAULT_TODOS.map(text => ({ text: text, checked: false }));
        const listContainer = document.getElementById('todoListContainer');
        
        function renderTodos() {
            listContainer.innerHTML = '';
            todoData.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = `todo-item ${item.checked ? 'completed' : ''}`;
                li.innerHTML = `
                    <input type="checkbox" ${item.checked ? 'checked' : ''}>
                    <span>${item.text}</span>
                `;
                li.addEventListener('click', (e) => {
                    if (e.target.tagName === 'INPUT') return;
                    todoData[index].checked = !todoData[index].checked;
                    renderTodos();
                });
                li.querySelector('input').addEventListener('change', () => {
                    todoData[index].checked = !todoData[index].checked;
                    renderTodos();
                });
                listContainer.appendChild(li);
            });
        }

        function handleScrollAnimation(type, newValueString) {
            if (lastTimeStrings[type] === newValueString) return; 

            const track = document.getElementById(`track-${type}`);
            if (!track) return;
            const currentEl = track.querySelector('.current');
            const nextEl = track.querySelector('.next');

            if (lastTimeStrings[type] === "") {
                currentEl.innerText = newValueString;
                lastTimeStrings[type] = newValueString;
                return;
            }

            nextEl.innerText = newValueString; 
            track.classList.add('slide-up');   

            setTimeout(() => {
                track.style.transition = 'none';      
                currentEl.style.transition = 'none';
                nextEl.style.transition = 'none';

                currentEl.innerText = newValueString; 
                track.classList.remove('slide-up');   
                track.offsetHeight;                   
                
                track.style.transition = '';          
                currentEl.style.transition = '';
                nextEl.style.transition = '';

                lastTimeStrings[type] = newValueString; 
            }, 300);
        }

        // 初始化
        renderTodos();
        updateTimeline(); 
        const timelineInterval = setInterval(updateTimeline, 1000);
    </script>

    <!-- 🍔 載入側邊導覽列邏輯 -->
    <script src="js/nav.js"></script>

    <!-- 🔧 註冊 Service Worker（支援離線與安裝） -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then((reg) => console.log('Service Worker 註冊成功：', reg.scope))
                    .catch((err) => console.error('Service Worker 註冊失敗：', err));
            });
        }
    </script>
